# Maya's org profile + the funder pages GrantHound watches for her.
#
# Data, not code. `seeds` were assembled on 2026-09-06 from ~40 candidates
# (docs/seed-candidates.txt) and filtered by scripts/seed_check.py, which
# rejects pages that render client-side (the pipeline never runs a browser).
# Nobody checked liveness by hand: the agent doing that is the product.
# One entry, fixtures/sunset-fund, is a test page we control (is_fixture: true),
# disclosed in the README and on camera, so a page CHANGE can be demonstrated.

org:
  name: Riverbend Youth Collective
  profile: |
    501(c)(3) community youth-development org. Budget ~$185K. Two part-time
    staff plus volunteers. Programs: after-school arts + mentoring for ages
    10-16. Geography: Columbus, OH metro (Franklin County).
  commitment_windows:
    - {label: fall program launch, start: 2026-09-01, end: 2026-09-20}

